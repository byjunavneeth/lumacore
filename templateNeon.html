<!doctype html>

<html>
<head>
<meta charset="utf-8">
<title>ESP32 Pod Chat UI Sandbox</title>

<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{font-family:'Exo 2', sans-serif;}

:root{

/* =========================
   CORE PALETTE
   ========================= */

--black:#000000;        /* foundation */
--violet:#33ea29;       /* primary accent */
--neon-pink:#0dc2d6;    /* secondary accent */
--soft-gold:#FAEB92;    /* highlight */


/* =========================
   BACKGROUND SYSTEM
   ========================= */

--bg-main:#000000;        /* entire app */
--bg-panel:#0A0A0A;      /* lifted from black so UI has depth */
--bg-chat:#121212;       /* readable layer */
--bg-input:#0F0F0F;

--bg-incoming:#181818;
--bg-outgoing:#cad85e;


/* =========================
   TEXT SYSTEM
   ========================= */

--text-main:#FAEB92;      /* gold reads beautifully on black */
--text-muted:#d4df73;

--text-incoming:#EAD9FF;
--text-outgoing:#FFFFFF;

--text-pod-name:#08343a;   /* pink = identity marker */


/* =========================
   BUTTONS
   ========================= */

--btn-primary:#29baea;
--btn-text:#FFFFFF;


/* =========================
   ACCENTS
   ========================= */

--accent-notification:#FF5FCF;
--color-danger:#FF4D6D;


/* =========================
   BORDERS
   ========================= */

--border-soft:rgba(255,95,207,.18);

}

body{
margin:0;
background:var(--bg-main);
font-family:var(--font-main);
color:var(--text-main);
}

button{
border-radius:var(--radius-md);
border:var(--border-soft);
background:var(--btn-primary);
color:var(--btn-text);
padding:10px 16px;
cursor:pointer;
transition:.2s;
}

button:hover{
filter:brightness(1.15);
}
/*----------------------------------------------------------------------------------------------------------------

/* ===== SIDEBAR ===== */

#currentNode{
font-size:1.4rem;
letter-spacing:3px;
font-weight:600;
position:relative;
top:-20px;   /* move upward */

}


#sidebarWrapper{
position:fixed;
top:0;
left:-260px;
height:100%;
width:260px;
transition:.35s ease;
z-index:1000;
}
#sidebarWrapper.open{left:0;}

#sidebar{
height:100%;
background:var(--bg-panel);
border-right:1px solid rgba(255,255,255,.05);
}

.sidebar-header{
background:var(--bg-main);
padding:18px;
text-align:center;
letter-spacing:2px;
}

#menuToggle{
position:absolute;
right:-48px;
top:20px;
width:38px;
height:38px;
border-radius:6px;
background:var(--btn-primary);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:4px;
cursor:pointer;
}
.dot{width:5px;height:5px;background:white;border-radius:50%;}

#nodeList{
display:flex;
flex-direction:column;
gap:8px;
padding:16px;
}

.podItem{
padding:10px;
border-radius:6px;
cursor:pointer;
text-align:center;
border:1px solid transparent;
transition:.18s;
position:relative;
}

.podItem:hover{border:1px solid rgba(95,149,152,.35);}
.podItem.active{background:#0f2f3b;}

.unreadDot{
position:absolute;
right:8px;
top:50%;
transform:translateY(-50%);
width:8px;height:8px;
border-radius:50%;
background:var(--accent-notification);
}

/* ===== MAIN ===== */

#main{
position:absolute;
left:0;top:0;width:100%;height:100%;
padding:26px 42px;box-sizing:border-box;
}

#topBar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:14px;
padding-left: 40px;
}

.header-btn{
padding:8px 14px;
border-radius:6px;
background:#3A4F5C;
border:1px solid rgba(255,255,255,.05);
color:white;
cursor:pointer;
}

#chat{
height:72%;
overflow-y:auto;
padding:16px;
border-radius:8px;
background:var(--bg-chat);
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
max-width:62%;
padding:16px;
border-radius:14px;
font-size:16px;
line-height:1.5;
position:relative; /* IMPORTANT for triangle */
}

.msg strong{
font-size:15px;        /* bigger pod name */
font-weight:600;
color:var(--text-pod-name);

        /* brighter than your muted teal */
display:inline-block;
margin-bottom:2px;
letter-spacing:.6px;
}

.incoming{
background:var(--bg-incoming);
color:var(--text-incoming);
border-radius:6px 14px 14px 14px;
}
.incoming::after{
content:"";
position:absolute;
left:-6px;
bottom:8px;

width:0;
height:0;

border-top:6px solid transparent;
border-bottom:6px solid transparent;
border-right:6px solid var(--bg-incoming);

}

.outgoing{
align-self:flex-end;
background:var(--bg-outgoing);
color:var(--text-outgoing);
font-weight:500;
border-radius:14px 6px 14px 14px;
}
.outgoing::after{
content:"";
position:absolute;
right:-6px;
bottom:8px;

width:0;
height:0;

border-top:6px solid transparent;
border-bottom:6px solid transparent;
border-left:6px solid var(--bg-outgoing);

}


.meta{font-size:10px;opacity:.6;margin-top:4px;}

#sendBox{margin-top:10px;display:none;gap:8px;}
#msg{
flex:1;
padding:14px;        /* makes inside spacing bigger */
height:35px;        /* controls actual textbox height */
border-radius:8px;  /* slightly more modern */
background:var(--bg-input);
color:var(--text-muted);
border:1px solid rgba(255,255,255,.06);
font-size:15px;     /* improves readability */
}


.send-btn{
width:82px;border-radius:6px;
background:var(--color-secondary);
border:none;color:white;
cursor:pointer;
}

.empty{text-align:center;opacity:.5;padding:20px;}

#toastContainer{
position:fixed;top:20px;left:50%;
transform:translateX(-50%);
display:flex;flex-direction:column;
gap:10px;z-index:9999;
}

.toast{
background:var(--bg-panel);
color:var(--text-main);
padding:14px 18px;border-radius:8px;
min-width:260px;
animation:slide .3s ease;
}

@keyframes slide{
from{opacity:0;transform:translateY(-20px);}
to{opacity:1;}
}

#notifPanel{
position:fixed;top:70px;right:40px;
width:280px;max-height:420px;
overflow-y:auto;background:var(--bg-panel);
border-radius:8px;display:none;
flex-direction:column;
}

.notifItem{
padding:12px;
border-bottom:1px solid rgba(255,255,255,.05);
cursor:pointer;
}

#statusModal{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.65);
display:none;
align-items:center;
justify-content:center;
}

.modalCard{
background:var(--bg-panel);
padding:22px;
border-radius:10px;
width:520px;
}

</style>

</head>

<body>

<div id="sidebarWrapper">
<div id="sidebar">
<div class="sidebar-header"><h2>PODS</h2></div>
<div id="nodeList"></div>
</div>
<div id="menuToggle"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>

<div id="main">

<div id="topBar">
<h3 id="currentNode">SELECT A POD</h3>

<div>
<button id="statusBtn" class="header-btn">POD STATUS</button>
<button id="notifBtn" class="header-btn">NOTIFICATIONS</button>
<button id="downloadBtn" class="header-btn">DOWNLOAD LOGS</button>
</div>
</div>

<div id="chat"><div class="empty">No messages yet</div></div>

<div id="sendBox">
<input id="msg" placeholder="Type message">
<button class="send-btn" onclick="sendMessage()">Send</button>
</div>

</div>

<div id="toastContainer"></div>
<div id="notifPanel"></div>

<div id="statusModal">
<div class="modalCard">
<h3>POD STATUS</h3>
<button onclick="closeStatus()">Close</button>
<table style="width:100%;margin-top:10px;">
<tbody id="statusTable"></tbody>
</table>
</div>
</div>

<script>

/* ===== FAKE DATA ===== */

const pods = ["Pod Alpha","Pod Beta","Pod Gamma"];
let selectedPod=null;
let messages=[];
let unread={};

const fakeTexts=[
"Signal strong.",
"Battery stable.",
"Movement detected.",
"Entering low power mode.",
"Packet received.",
"Scanning sector..."
];

/* ===== SIDEBAR ===== */

menuToggle.onclick=()=>{
sidebarWrapper.classList.toggle("open");
};

function renderPods(){

nodeList.innerHTML="";

["ALL PODS",...pods].forEach(p=>{

const div=document.createElement("div");
div.className="podItem"+(selectedPod===p?" active":"");
div.textContent=p;

if(unread[p]){
const dot=document.createElement("div");
dot.className="unreadDot";
div.appendChild(dot);
}

div.onclick=()=>{
selectedPod=p==="ALL PODS"?null:p;
unread[p]=0;
sendBox.style.display="flex";
currentNode.textContent=p;
renderPods();
renderChat();
};

nodeList.appendChild(div);
});

}

/* ===== CHAT ===== */

function renderChat(){

chat.innerHTML="";

const data=selectedPod
?messages.filter(m=>m.pod===selectedPod || m.from==="Me")
:messages;

if(!data.length){
chat.innerHTML='<div class="empty">No messages yet</div>';
return;
}

data.forEach(m=>{

const div=document.createElement("div");
div.className="msg "+(m.from==="Me"?"outgoing":"incoming");

let label = m.from;

// ⭐ If message is from Me AND we are viewing ALL PODS
if(m.from === "Me" && selectedPod === null){
    label = m.pod === "ALL" 
        ? "Me → ALL"
        : `Me → ${m.pod}`;
}


div.innerHTML=`<strong>${label}</strong><br>${m.text}<div class="meta">${m.time}</div>`;

chat.appendChild(div);

});

chat.scrollTop=chat.scrollHeight;
}

/* ===== SEND ===== */

function sendMessage(){

if(!msg.value.trim()) return;

messages.push({
from:"Me",
pod: selectedPod === null ? "ALL" : selectedPod,
text: msg.value,
time: new Date().toLocaleTimeString()
});


msg.value="";
msg.focus();
renderChat();
}

/* ===== SIMULATE INCOMING ===== */

function simulateIncoming(){

const pod=pods[Math.floor(Math.random()*pods.length)];

messages.push({
from:pod,
pod:pod,
text:fakeTexts[Math.floor(Math.random()*fakeTexts.length)],
time:new Date().toLocaleTimeString()
});

unread[pod]=(unread[pod]||0)+1;

showToast(pod);
addNotification(pod);

renderPods();
renderChat();
}

/* ===== TOAST ===== */

function showToast(pod){

const t=document.createElement("div");
t.className="toast";
t.innerHTML=`<strong>${pod}</strong> New message`;
toastContainer.appendChild(t);

setTimeout(()=>t.remove(),3000);
}

/* ===== NOTIFICATIONS ===== */

notifBtn.onclick=()=>{
notifPanel.style.display=
notifPanel.style.display==="flex"?"none":"flex";
};

function addNotification(pod){

const item=document.createElement("div");
item.className="notifItem";
item.innerHTML=`<strong>${pod}</strong> New message`;

item.onclick=()=>{
selectedPod=pod;
notifPanel.style.display="none";
renderPods();
renderChat();
};

notifPanel.prepend(item);
}

/* ===== STATUS ===== */

statusBtn.onclick=()=>{
statusModal.style.display="flex";
renderStatus();
};

function closeStatus(){
statusModal.style.display="none";
}

function renderStatus(){

statusTable.innerHTML="";

pods.forEach(p=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${p}</td>
<td>${Math.floor(Math.random()*100)}%</td>
<td>${Math.random()>.2?"ACTIVE":"INACTIVE"}</td>
`;

statusTable.appendChild(tr);

});

}

/* ===== DOWNLOAD ===== */

downloadBtn.onclick=()=>{

if(!messages.length){
alert("No logs yet");
return;
}

const blob=new Blob(
[messages.map(m=>`${m.time} ${m.from}: ${m.text}`).join("\n")],
{type:"text/plain"}
);

const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="chat_logs.txt";
a.click();
};

/* ===== START ===== */

renderPods();

document.getElementById("msg").addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        e.preventDefault();
        sendMessage();
    }

});

setInterval(simulateIncoming,4000);


</script>

</body>
</html>
