<!doctype html>

<html>
<head>
<meta charset="utf-8">
<title>ESP32 Pod Chat UI Sandbox</title>

<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{font-family:'Exo 2', sans-serif;}

:root{

/* =========================
   CORE PALETTE
   ========================= */

--primary:#EAEFEF;     /* main surfaces */
--secondary:#BFC9D1;   /* layered panels */
--deep:#25343F;        /* text / structure */
--accent:#FF9B51;      /* actions / highlights */


/* =========================
   BACKGROUND SYSTEM
   ========================= */

--bg-main:var(--primary);        /* entire app */
--bg-panel:var(--secondary);     /* sidebar / cards */
--bg-chat:var(--primary);       /* message area */
--bg-input:var(--secondary);

--bg-incoming:var(--secondary);
--bg-outgoing:var(--accent);


/* =========================
   TEXT SYSTEM
   ========================= */

--text-main:var(--deep);
--text-muted:#5A6B77;   /* softened deep */

--text-incoming:var(--deep);
--text-outgoing:#FFFFFF;

--text-pod-name:var(--accent);


/* =========================
   BUTTONS
   ========================= */

--btn-primary:var(--deep);
--btn-text:#FFFFFF;


/* =========================
   ACCENTS
   ========================= */

--accent-notification:var(--accent);
--color-danger:#FF6B6B;


/* =========================
   BORDERS
   ========================= */

--border-soft:rgba(37,52,63,.15);

}





body{
margin:0;
background:var(--bg-main);
font-family:var(--font-main);
color:var(--text-main);
}

button{
border-radius:var(--radius-md);
border:var(--border-soft);
background:var(--btn-primary);
color:var(--btn-text);
padding:10px 16px;
cursor:pointer;
transition:.2s;
}

button:hover{
filter:brightness(1.15);
}
/*----------------------------------------------------------------------------------------------------------------

/* ===== SIDEBAR ===== */

#currentNode{
font-size:1.4rem;
letter-spacing:3px;
font-weight:600;
position:relative;
top:-20px;   /* move upward */

}


#sidebarWrapper{
position:fixed;
top:0;
left:-260px;
height:100%;
width:260px;
transition:.35s ease;
z-index:1000;
}
#sidebarWrapper.open{left:0;}

#sidebar{
height:100%;
background:var(--bg-panel);
border-right:1px solid rgba(255,255,255,.05);
}

.sidebar-header{
background:var(--bg-main);
padding:18px;
text-align:center;
letter-spacing:2px;
}

#menuToggle{
position:absolute;
right:-48px;
top:20px;
width:38px;
height:38px;
border-radius:6px;
background:var(--btn-primary);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:4px;
cursor:pointer;
}
.dot{width:5px;height:5px;background:white;border-radius:50%;}

#nodeList{
display:flex;
flex-direction:column;
gap:8px;
padding:16px;
}

.podItem{
padding:10px;
border-radius:6px;
cursor:pointer;
text-align:center;
border:1px solid transparent;
transition:.18s;
position:relative;
}

.podItem:hover{border:1px solid rgba(95,149,152,.35);}
.podItem.active{background:#0f2f3b;}

.unreadDot{
position:absolute;
right:8px;
top:50%;
transform:translateY(-50%);
width:8px;height:8px;
border-radius:50%;
background:var(--accent-notification);
}

/* ===== MAIN ===== */

#main{
position:absolute;
left:0;top:0;width:100%;height:100%;
padding:26px 42px;box-sizing:border-box;
}

#topBar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:14px;
padding-left: 40px;
}

.header-btn{
padding:8px 14px;
border-radius:6px;
background:#3A4F5C;
border:1px solid rgba(255,255,255,.05);
color:white;
cursor:pointer;
}

#chat{
height:72%;
overflow-y:auto;
padding:16px;
border-radius:8px;
background:var(--bg-chat);
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
max-width:62%;
padding:16px;
border-radius:14px;
font-size:16px;
line-height:1.5;
position:relative; /* IMPORTANT for triangle */
}

.msg strong{
font-size:15px;        /* bigger pod name */
font-weight:600;
color:var(--text-pod-name);

        /* brighter than your muted teal */
display:inline-block;
margin-bottom:2px;
letter-spacing:.6px;
}

.incoming{
background:var(--bg-incoming);
color:var(--text-incoming);
border-radius:6px 14px 14px 14px;
}
.incoming::after{
content:"";
position:absolute;
left:-6px;
bottom:8px;

width:0;
height:0;

border-top:6px solid transparent;
border-bottom:6px solid transparent;
border-right:6px solid var(--bg-incoming);

}

.outgoing{
align-self:flex-end;
background:var(--bg-outgoing);
color:var(--text-outgoing);
font-weight:500;
border-radius:14px 6px 14px 14px;
}
.outgoing::after{
content:"";
position:absolute;
right:-6px;
bottom:8px;

width:0;
height:0;

border-top:6px solid transparent;
border-bottom:6px solid transparent;
border-left:6px solid var(--bg-outgoing);

}


.meta{font-size:10px;opacity:.6;margin-top:4px;}

#sendBox{margin-top:10px;display:none;gap:8px;}
#msg{
flex:1;
padding:14px;        /* makes inside spacing bigger */
height:35px;        /* controls actual textbox height */
border-radius:8px;  
background:var(--bg-input);
color:var(--text-muted);
border:1px solid rgba(255,255,255,.06);
font-size:15px;     
}


.send-btn{
width:82px;border-radius:6px;
background:var(--color-secondary);
border:none;color:white;
cursor:pointer;
}

.empty{text-align:center;opacity:.5;padding:20px;}

#toastContainer{
position:fixed;top:20px;left:50%;
transform:translateX(-50%);
display:flex;flex-direction:column;
gap:10px;z-index:9999;
}

.toast{
background:var(--bg-panel);
color:var(--text-main);
padding:14px 18px;border-radius:8px;
min-width:260px;
animation:slide .3s ease;
}

@keyframes slide{
from{opacity:0;transform:translateY(-20px);}
to{opacity:1;}
}

#notifPanel{
position:fixed;top:70px;right:40px;
width:280px;max-height:420px;
overflow-y:auto;background:var(--bg-panel);
border-radius:8px;display:none;
flex-direction:column;
}

.notifItem{
padding:12px;
border-bottom:1px solid rgba(255,255,255,.05);
cursor:pointer;
}

#statusModal{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.65);
display:none;
align-items:center;
justify-content:center;
}

.modalCard{
background:var(--bg-panel);
padding:22px;
border-radius:10px;
width:520px;
}

</style>

</head>

<body>

<div id="sidebarWrapper">
<div id="sidebar">
<div class="sidebar-header"><h2>PODS</h2></div>
<div id="nodeList"></div>
</div>
<div id="menuToggle"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>

<div id="main">

<div id="topBar">
<h3 id="currentNode">SELECT A POD</h3>

<div>
<button id="statusBtn" class="header-btn">POD STATUS</button>
<button id="notifBtn" class="header-btn">NOTIFICATIONS</button>
<button id="downloadBtn" class="header-btn">DOWNLOAD LOGS</button>
</div>
</div>

<div id="chat"><div class="empty">No messages yet</div></div>

<div id="sendBox">
<input id="msg" placeholder="Type message">
<button class="send-btn" onclick="sendMessage()">Send</button>
</div>

</div>

<div id="toastContainer"></div>
<div id="notifPanel"></div>

<div id="statusModal">
<div class="modalCard">
<h3>POD STATUS</h3>
<button onclick="closeStatus()">Close</button>
<table style="width:100%;margin-top:10px;">
<tbody id="statusTable"></tbody>
</table>
</div>
</div>

<script>

const baseURL = "http://192.168.4.1";

let messages = [];
let selectedNode = null;
let unread = {};

document.getElementById("menuToggle").onclick = () => {
    document.getElementById("sidebarWrapper").classList.toggle("open");
};


async function fetchMessages() {
  try {
    const res = await fetch(baseURL + "/messages", {cache: "no-store"});
    if (!res.ok) return;

    const msgs = await res.json();

    msgs.forEach(m => {
      if (!messages.find(x => x.msgID === m.msgID)) {
        m.receivedAt = new Date().toLocaleString();
        messages.push(m);

        if (m.sender !== "MASTER") {
          const node = m.sender;
          if (selectedNode !== node) {
            unread[node] = (unread[node] || 0) + 1;
          }
        }
      }
    });

    updateNodeList();
    renderChat();

  } catch (e) {
    console.error("Fetch error", e);
  }
}

function updateNodeList() {
  const nodeList = document.getElementById("nodeList");

  const uniqueNodes = [...new Set(
    messages.flatMap(m => [m.sender, m.target])
      .filter(n => n && n !== "Me" && n !== "MASTER")
  )];

  nodeList.innerHTML = "";

  uniqueNodes.forEach(node => {
    const div = document.createElement("div");
    div.className = "podItem " + (node === selectedNode ? "active" : "");

    const count = unread[node] || 0;

    div.innerHTML = `
      <span>${node}</span>
      ${count > 0 ? `<span class="badge">${count}</span>` : ""}
    `;

    div.onclick = () => {
      selectedNode = node;
      unread[node] = 0;
      document.getElementById("currentNode").textContent = "Chat with " + node;
      document.getElementById("sendBox").style.display = "flex";
      renderChat();
      updateNodeList();
    };

    nodeList.appendChild(div);
  });
}

function renderChat() {
  const chatDiv = document.getElementById("chat");
  chatDiv.innerHTML = "";

  if (!selectedNode) {
    chatDiv.innerHTML = '<div class="empty">No messages yet</div>';
    return;
  }

  const nodeMsgs = messages.filter(m =>
    (m.sender === selectedNode && m.target === "MASTER") ||
    (m.sender === "MASTER" && m.target === selectedNode)
  );

  if (nodeMsgs.length === 0) {
    chatDiv.innerHTML = '<div class="empty">No messages yet</div>';
    return;
  }

  nodeMsgs.forEach(m => {
    const isOutgoing = (m.sender === "MASTER" && m.target === selectedNode);

    const bubble = document.createElement("div");
      bubble.className = "msg " + (isOutgoing ? "outgoing" : "incoming");

    bubble.innerHTML = `
      <strong>${isOutgoing ? "Me" : m.sender}</strong><br>
      ${escapeHtml(m.text)}
      <div class="meta">${escapeHtml(m.receivedAt)}</div>
    `;

    chatDiv.appendChild(bubble);
  });

  chatDiv.scrollTop = chatDiv.scrollHeight;
}

async function sendMessage() {
  if (!selectedNode) return;

  const msgInput = document.getElementById("msg");
  const msg = msgInput.value.trim();
  if (!msg) return;

  const newMsg = {
    msgID: Date.now().toString(),
    sender: "MASTER",
    target: selectedNode,
    text: msg,
    receivedAt: new Date().toLocaleString()
  };

  // ✅ Optimistic UI (show instantly)
  messages.push(newMsg);
  renderChat();

  msgInput.value = "";

  try {
    const url = `${baseURL}/send?target=${encodeURIComponent(selectedNode)}&msg=${encodeURIComponent(msg)}`;
    await fetch(url);
  } catch (e) {
    console.error("Send error", e);
  }
}


function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

document.getElementById("downloadBtn").addEventListener("click", function() {
  if (messages.length === 0) {
    alert("No messages to download");
    return;
  }

  const lines = messages.map(m =>
    `[${m.receivedAt}] ${m.sender} → ${m.target || ""} | ${m.text}`
  );

  const blob = new Blob([lines.join("\n")], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "chat_logs.txt";
  a.click();
  URL.revokeObjectURL(url);
});
document.getElementById("msg").addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
        e.preventDefault();   // stops newline
        sendMessage();        // send the message
        this.value = "";      // clear textbox instantly
    }

});

fetchMessages();
setInterval(fetchMessages, 2000);

</script>


</body>
</html>
